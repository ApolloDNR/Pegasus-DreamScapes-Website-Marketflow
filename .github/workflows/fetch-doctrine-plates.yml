name: Fetch doctrine plates

# Vendors the generated doctrine imagery into the repo so the reference
# build serves local, self-hosted assets instead of a generation CDN.
# Runs on push to the doctrine branch; no-ops once everything exists.
# (Its own commit uses GITHUB_TOKEN, which cannot re-trigger this
# workflow, so there is no recursion.)
on:
  push:
    branches:
      - claude/pegasus-dreamscapes-website-ejca8n
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          set -euo pipefail
          dir=artifacts/doctrine/plates
          mkdir -p "$dir"
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3EqMQTGQ3AQXoXTWf2covcEGyhp"
          fetch() {
            if [ -s "$dir/$2" ]; then echo "have $2"; else
              curl -fsSL --retry 3 "$base/$1" -o "$dir/$2"; echo "fetched $2"; fi
          }
          # hero pair: the villa street, realistic estate photography (day/night)
          fetch hf_20260706_204200_865e834f-033a-47b3-be26-51877f8a98e3_min.webp hero-day.webp
          fetch hf_20260706_204451_ad33bd4d-2627-45a0-a3ed-9c72585762e2_min.webp hero-night.webp
          # the loggia pair (v16, replaces the veranda across the site)
          fetch hf_20260708_151606_19646bf7-a6cc-46c0-a36d-d4f7551916f6_min.webp loggia-day.webp
          fetch hf_20260708_151721_02173e09-6ddc-4247-a632-3b2284882dd3_min.webp loggia-night.webp
          # east bay + carved record pairs
          fetch hf_20260706_040841_04b667fd-09a2-44fc-bffc-3b0121041527_min.webp bay.webp
          fetch hf_20260706_154243_68efe569-aa30-48c0-9d9f-639dc3bf6744_min.webp bay-day.webp
          fetch hf_20260706_040849_064bcda5-bc72-4f74-a86a-d5a1a9ecaf85_min.webp stone.webp
          fetch hf_20260706_154246_c1534da8-70fe-45c3-89aa-c7c87e24b085_min.webp stone-day.webp
          # corinthian columns macro pair (v13, Pegasus Standard strip)
          fetch hf_20260707_214454_eed249dd-dc55-4a1e-9b34-e481df3ab0ca_min.webp columns-day.webp
          fetch hf_20260707_215318_6d791a90-ca48-4c8d-a8eb-b2428d92f5e0_min.webp columns-night.webp
          # v14 sunset hero: the classical boulevard pair + supporting sunset plates
          fetch hf_20260708_030605_56060a6a-7f55-4824-adc9-4c6f4b7c279b_min.webp hero2-day.webp
          fetch hf_20260708_030922_96a9fd67-da9b-4b6e-b0ec-f67fa6a30139_min.webp hero2-night.webp
          fetch hf_20260708_030546_313b963b-284e-4338-9fe8-a41ed0819908_min.webp estate-sunset.webp
          fetch hf_20260708_030555_b3970b92-73a8-4e94-b22e-62a2ab6f3fa8_min.webp gate-sunset.webp
          # hero ambient dolly (v15): 2K master, transcoded to hero-loop.mp4 below
          if [ -s "$dir/hero-loop.mp4" ]; then echo "have hero-loop.mp4"; else
            curl -fsSL --retry 3 "$base/hf_20260708_035205_271a05e3-d4bf-455c-b162-4e87996df567.mp4" -o "$dir/hero-loop-2k.mp4"
            echo "fetched hero-loop-2k.mp4"
          fi
          # loggia walk footage (v16): night 720p ambient + 2K masters for frame extraction
          fetch hf_20260708_151815_4b37f230-3a12-4758-a163-bf51385f1014.mp4 colonnade-walk.mp4
          # 2K walk masters fetched only while their frame sets are missing
          if [ ! -d "$dir/walk2-night" ]; then
            fetch hf_20260708_152351_8d8c4ae0-3f23-4cce-a62b-ebc6be004048.mp4 walk2-night-2k.mp4
          fi
          # DreamScapes vision renders (Scenario, signed URLs)
          vfetch() {
            if [ -s "artifacts/doctrine/vision/$2" ]; then echo "have $2"; else
              curl -fsSL --retry 3 "$1" -o "artifacts/doctrine/vision/$2"; echo "fetched $2"; fi
          }
          mkdir -p artifacts/doctrine/vision
          vfetch "https://cdn.cloud.scenario.com/assets-transform/asset_kse575VzmxsRcRTMpgTPwrur?p=100&format=webp&Policy=eyJTdGF0ZW1lbnQiOlt7IlJlc291cmNlIjoiaHR0cHM6Ly9jZG4uY2xvdWQuc2NlbmFyaW8uY29tL2Fzc2V0cy10cmFuc2Zvcm0vYXNzZXRfa3NlNTc1VnpteHNSY1JUTXBnVFB3cnVyP3A9MTAwJmZvcm1hdD13ZWJwKiIsIkNvbmRpdGlvbiI6eyJEYXRlTGVzc1RoYW4iOnsiQVdTOkVwb2NoVGltZSI6MTc4NDA3MzU5OX19fV19&Key-Pair-Id=K36FIAB9LE2OLR&Signature=UVYklkOwx1tz3YPaMr2B-EwOeRrjU0dZ0~AZv-5pA1tmLNwkb3vsILn0GGj2AkmkbJa4Q~SuNf4dg09JYVdVIY4Oheh09ovT8CDn4OObTZdw-7VaBwReXMY-zu6CoWVUO7-uDKfokUOaV4pGFib5Sx6lq~kQ2YEpJgrUdQUmA4Isz7PVsRl5Vai6kwXovhK9mB-3kZax4WfXFYQNpdpDytaRVlwiFUNGjH8TjO9~G4MGQe4BFFbytYkOO89PpKnOHSu3tQq2EkZBSNypyztXOe7dStmc0ouDxW8AT9dd1EjrqSYa99FJyl-8nCQfLc8PaVO1GO20XneD4~zrIjnweQ__" aerial.webp
          vfetch "https://cdn.cloud.scenario.com/assets-transform/asset_2a3t5WdJm32LLssrPakVkuvA?p=100&format=webp&Policy=eyJTdGF0ZW1lbnQiOlt7IlJlc291cmNlIjoiaHR0cHM6Ly9jZG4uY2xvdWQuc2NlbmFyaW8uY29tL2Fzc2V0cy10cmFuc2Zvcm0vYXNzZXRfMmEzdDVXZEptMzJMTHNzclBha1ZrdXZBP3A9MTAwJmZvcm1hdD13ZWJwKiIsIkNvbmRpdGlvbiI6eyJEYXRlTGVzc1RoYW4iOnsiQVdTOkVwb2NoVGltZSI6MTc4NDA3MzU5OX19fV19&Key-Pair-Id=K36FIAB9LE2OLR&Signature=FUKyWnv52kF2XKMifjbjDW60Vz--x33CRXBHm-WExnTmNr-pPjU2Tnsk3kdMLKRR1NwaP-fWMbPfWTnLPNMMelxLoyt24eMWTrRhxImjbiQnNu1Vs-26HU1i~q42J5XXRHFLvcgamlsl6LwtJEOPgIYsJfrC8xJ7i29UBl-kC5PDIDQNlXQ4oyho8u-zsOIj-fAAKjRCiw1KycFAcsNlwvd~3X3Xya4A78Ge9I1B2GeP-H~~no~HOMxrVniebZDYM413OJJlOxKRFSXOrIvdqqnkBw1TFznOmmATTUnp7RNOafdmm~3U3G-WDbMJhzvYzAZ8Dk4X~93QwDdINJmR3A__" gate.webp
          vfetch "https://cdn.cloud.scenario.com/assets-transform/asset_Eh1bnHxYNqnGALraJXKehs3j?p=100&format=webp&Policy=eyJTdGF0ZW1lbnQiOlt7IlJlc291cmNlIjoiaHR0cHM6Ly9jZG4uY2xvdWQuc2NlbmFyaW8uY29tL2Fzc2V0cy10cmFuc2Zvcm0vYXNzZXRfRWgxYm5IeFlOcW5HQUxyYUpYS2VoczNqP3A9MTAwJmZvcm1hdD13ZWJwKiIsIkNvbmRpdGlvbiI6eyJEYXRlTGVzc1RoYW4iOnsiQVdTOkVwb2NoVGltZSI6MTc4NDA3MzU5OX19fV19&Key-Pair-Id=K36FIAB9LE2OLR&Signature=XiDa6sC8GMbo-d6XRGthEdp2Cdha~GFUu~ZR1iIXrl6t79gXWHkB5CB2rSkvXVhfirhrYWAN7KuyygeyGJjI1-1c1Bg5NqteEMq2VtfwtigS8BEkJGMD~bbeyePmZnrmxmXIaLDtKuFcU85KfB8H1YAZqpsiR4QC1DxQwmz6JnZQh6YlZQ9iAINrupDrVHP4TY3lPw5xWZ2vuUFnYgYtr8ZeGbmoUT-WPATmE7WL9iD8pO1NrET5ZIWtz6LpD3RYigefBoUwWxRztJgkOp9qoJAc8NsbJ2-LrlF0iSGW5tsmlFWItO8zWmVgtqI2DNmOyQWswqEcG6m8MIdIBFVEqQ__" boulevard.webp
          # dreamscapes element tiles
          vfetch "$base/hf_20260706_204200_865e834f-033a-47b3-be26-51877f8a98e3_min.webp" estates.webp
          vfetch "$base/hf_20260707_070910_d9f0124f-46ca-4e10-b290-35149748d2c8_min.webp" lanes.webp
          vfetch "$base/hf_20260707_070913_89a0641c-ef42-4649-9c59-64149b084ecd_min.webp" forum.webp
          vfetch "$base/hf_20260707_070915_da5b8fda-86b2-4967-946b-ee01d115137f_min.webp" academy.webp
          vfetch "$base/hf_20260707_070918_1bfb2f7a-a653-4c9c-a582-e9f0178df30a_min.webp" water.webp
          vfetch "$base/hf_20260707_070921_58be642a-c84f-4453-8b57-64ab2b91a47d_min.webp" infra.webp
          ls -la "$dir"
      - name: Extract walk frames + transcode hero loop
        run: |
          set -euo pipefail
          dir=artifacts/doctrine/plates
          need_ffmpeg=0
          for theme in night day; do
            [ -d "$dir/walk2-$theme" ] && [ "$(ls -1 "$dir/walk2-$theme" 2>/dev/null | wc -l)" -ge 40 ] || need_ffmpeg=1
          done
          [ -s "$dir/hero-loop.mp4" ] || [ ! -s "$dir/hero-loop-2k.mp4" ] || need_ffmpeg=1
          [ "$need_ffmpeg" = 0 ] && { echo "frames extracted and hero loop present"; exit 0; }
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          for theme in night day; do
            fdir="$dir/walk2-$theme"
            if [ -d "$fdir" ] && [ "$(ls -1 "$fdir" 2>/dev/null | wc -l)" -ge 40 ]; then
              echo "have $theme frames"; continue
            fi
            if [ ! -s "$dir/walk2-$theme-2k.mp4" ]; then
              echo "no 2K master for $theme yet — skipping"; continue
            fi
            mkdir -p "$fdir"
            ffmpeg -hide_banner -loglevel error -y -i "$dir/walk2-$theme-2k.mp4" \
              -vf "fps=6,scale=1600:-2" -c:v libwebp -q:v 70 "$fdir/f-%03d.webp"
            echo "extracted $(ls -1 "$fdir" | wc -l) $theme frames"; du -sh "$fdir"
          done
          # hero ambient loop: 2K master -> web-compressed 1920px h264
          if [ ! -s "$dir/hero-loop.mp4" ] && [ -s "$dir/hero-loop-2k.mp4" ]; then
            ffmpeg -hide_banner -loglevel error -y -i "$dir/hero-loop-2k.mp4" \
              -vf "scale=1920:-2" -c:v libx264 -preset slow -crf 25 -movflags +faststart -an "$dir/hero-loop.mp4"
            echo "hero loop: $(du -h "$dir/hero-loop.mp4" | cut -f1)"
          fi
          # the 2K masters stay on the CDN; don't commit ~50MB of mp4
          rm -f "$dir/walk2-night-2k.mp4" "$dir/walk2-day-2k.mp4" "$dir/hero-loop-2k.mp4"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/doctrine/plates artifacts/doctrine/vision
          git commit -m "Vendor day/night doctrine plates and 2K walk frames" || echo "nothing to commit"
          git push
