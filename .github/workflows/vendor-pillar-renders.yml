name: vendor-pillar-renders
on:
  push:
    paths:
      - '.github/relay-fire.txt'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webp
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Fetch and convert renders
        run: |
          mkdir -p out
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3EqMQTGQ3AQXoXTWf2covcEGyhp"
          declare -A M=( [plan1]="hf_20260729_001844_f5640860-82d9-4909-8666-e6575c40a3d4.png" [plan2]="hf_20260729_001844_28a84c90-d61a-4387-ae4a-dbf1194ce1bc.png" [ops1]="hf_20260729_001846_f8d95336-848b-4a43-a7dd-8f2d39ca900e.png" [ops2]="hf_20260729_001846_1db4e780-6939-4a14-825a-ccbc89b578d2.png" )
          for k in plan1 plan2 ops1 ops2; do
            curl -fsSL -o "out/$k.png" "$BASE/${M[$k]}"
            cwebp -q 86 "out/$k.png" -o "out/$k.webp"
            cwebp -q 80 -resize 1080 0 "out/$k.png" -o "out/$k-m.webp"
          done
          ls -la out
      - name: Commit to ci branch
        run: |
          git config user.name "pegasus-ci"
          git config user.email "ci@pegasusdreamscapes.com"
          git checkout -b ci/ws1-loggias
          mkdir -p docs/design/ws1-loggias
          cp out/*.webp docs/design/ws1-loggias/
          git add docs/design/ws1-loggias
          git commit -m "chore: vendor WS1 documentary loggia candidates"
          git push -f origin ci/ws1-loggias
