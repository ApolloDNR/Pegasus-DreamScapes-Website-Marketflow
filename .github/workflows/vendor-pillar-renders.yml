name: vendor-pillar-renders
on:
  push:
    paths:
      - '.github/relay-fire.txt'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webp
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Fetch and convert renders
        run: |
          mkdir -p out
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3EqMQTGQ3AQXoXTWf2covcEGyhp"
          declare -A M=( [p1]="hf_20260728_163001_623b2ad3-75d7-4519-a22b-f7c0e2e48992.png" [p2]="hf_20260728_163001_139c7aa2-6ead-4b58-a3dc-3dfe7e4266cb.png" [p3]="hf_20260728_163001_388f9263-32f3-4819-8c6c-ec3ad07c0469.png" [p4]="hf_20260728_163001_bb89d988-6446-4cc3-8fb6-9753a99639ad.png" )
          for k in p1 p2 p3 p4; do
            curl -fsSL -o "out/$k.png" "$BASE/${M[$k]}"
            cwebp -q 88 "out/$k.png" -o "out/$k.webp"
          done
          ls -la out
      - name: Commit to ci branch
        run: |
          git config user.name "pegasus-ci"
          git config user.email "ci@pegasusdreamscapes.com"
          git checkout -b ci/hero-photo
          mkdir -p docs/design/hero-photo
          cp out/*.webp docs/design/hero-photo/
          git add docs/design/hero-photo
          git commit -m "chore: vendor photoreal bay hero candidates"
          git push -f origin ci/hero-photo
