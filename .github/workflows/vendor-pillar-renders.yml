name: vendor-pillar-renders
on:
  push:
    paths:
      - '.github/relay-fire.txt'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webp
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Fetch and convert renders
        run: |
          mkdir -p out
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3EqMQTGQ3AQXoXTWf2covcEGyhp"
          declare -A M=( [c1]="hf_20260721_212305_65716904-c818-465c-9c92-ca7ca7d27130.png" [c2]="hf_20260721_212305_98e4d5e2-bbec-42ad-bef5-164632df139e.png" [c3]="hf_20260721_212305_be8a4ccf-9da6-4a4c-9be2-729ff7996e6e.png" [c4]="hf_20260721_212305_266b99e7-c61a-48ef-858f-32050437dc05.png" )
          for k in c1 c2 c3 c4; do
            curl -fsSL -o "out/$k.png" "$BASE/${M[$k]}"
            cwebp -q 88 "out/$k.png" -o "out/$k.webp"
          done
          ls -la out
      - name: Commit to ci branch
        run: |
          git config user.name "pegasus-ci"
          git config user.email "ci@pegasusdreamscapes.com"
          git checkout -b ci/pillar-renders-v2
          mkdir -p docs/design/pillars-renders-v2
          cp out/*.webp docs/design/pillars-renders-v2/
          git add docs/design/pillars-renders-v2
          git commit -m "chore: vendor cinematic marble render candidates v2"
          git push -f origin ci/pillar-renders-v2
