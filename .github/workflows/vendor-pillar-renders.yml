name: vendor-pillar-renders
on:
  push:
    paths:
      - '.github/relay-fire.txt'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webp
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Fetch and convert renders
        run: |
          mkdir -p out
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3EqMQTGQ3AQXoXTWf2covcEGyhp"
          declare -A M=( [b1]="hf_20260722_025004_2353148d-ddae-47d0-a1c0-4782b5be8b0a.png" [b2]="hf_20260722_025004_8595e308-a684-453d-849a-14f75d8a5b89.png" [b3]="hf_20260722_025004_27303fde-48da-46bb-983f-a8ab30310906.png" [b4]="hf_20260722_025004_9ede77d8-42ee-4ea9-a8ad-6e9a836e9899.png" )
          for k in b1 b2 b3 b4; do
            curl -fsSL -o "out/$k.png" "$BASE/${M[$k]}"
            cwebp -q 88 "out/$k.png" -o "out/$k.webp"
          done
          ls -la out
      - name: Commit to ci branch
        run: |
          git config user.name "pegasus-ci"
          git config user.email "ci@pegasusdreamscapes.com"
          git checkout -b ci/hero-bay2
          mkdir -p docs/design/hero-bay2
          cp out/*.webp docs/design/hero-bay2/
          git add docs/design/hero-bay2
          git commit -m "chore: vendor bay-terrace hero candidates v2"
          git push -f origin ci/hero-bay2
