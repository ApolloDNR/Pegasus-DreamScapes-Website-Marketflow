name: vendor-pillar-renders
on:
  push:
    paths:
      - '.github/relay-fire.txt'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webp
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Fetch and convert renders
        run: |
          mkdir -p out
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3EqMQTGQ3AQXoXTWf2covcEGyhp"
          declare -A M=( [h1]="hf_20260722_002341_78ea006a-e0dc-4504-a42a-a7b0199450e5.png" [h2]="hf_20260722_002341_1b1fb7b8-15e6-447f-a169-fa04e5738753.png" [h3]="hf_20260722_002342_2664dbab-3c16-4480-a09f-170494216adf.png" [h4]="hf_20260722_002342_02debc98-c86b-40b3-ab9e-bb5cdaa2de40.png" )
          for k in h1 h2 h3 h4; do
            curl -fsSL -o "out/$k.png" "$BASE/${M[$k]}"
            cwebp -q 88 "out/$k.png" -o "out/$k.webp"
          done
          ls -la out
      - name: Commit to ci branch
        run: |
          git config user.name "pegasus-ci"
          git config user.email "ci@pegasusdreamscapes.com"
          git checkout -b ci/hero-bay
          mkdir -p docs/design/hero-bay
          cp out/*.webp docs/design/hero-bay/
          git add docs/design/hero-bay
          git commit -m "chore: vendor bay-terrace hero candidates"
          git push -f origin ci/hero-bay
