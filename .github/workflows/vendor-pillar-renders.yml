name: vendor-pillar-renders
on:
  push:
    paths:
      - '.github/relay-fire.txt'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webp
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Fetch and convert renders
        run: |
          mkdir -p out
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3EqMQTGQ3AQXoXTWf2covcEGyhp"
          declare -A M=( [shaft]="hf_20260721_213822_793e5c3b-60cc-4007-b327-5c98e157aecf.png" [capital]="hf_20260721_213824_c515b7fe-6376-4acb-bc74-989bf752214b.png" [frieze]="hf_20260721_213826_88c9806e-6c63-4db4-b61d-1d93c8c56404.png" [goldring]="hf_20260721_213829_95c41530-8b76-48c2-8ee3-78b7f2f4c63c.png" [texture]="hf_20260721_213831_eff25416-01a5-4cd7-b0f1-c567a0ec842f.png" )
          for k in shaft capital frieze goldring texture; do
            curl -fsSL -o "out/$k.png" "$BASE/${M[$k]}"
            cwebp -q 88 "out/$k.png" -o "out/$k.webp"
          done
          ls -la out
      - name: Commit to ci branch
        run: |
          git config user.name "pegasus-ci"
          git config user.email "ci@pegasusdreamscapes.com"
          git checkout -b ci/site-imagery-v3
          mkdir -p docs/design/site-imagery
          cp out/*.webp docs/design/site-imagery/
          git add docs/design/site-imagery
          git commit -m "chore: vendor tailored site imagery set v3"
          git push -f origin ci/site-imagery-v3
