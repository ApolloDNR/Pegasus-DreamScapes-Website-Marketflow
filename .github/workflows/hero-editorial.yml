name: Hero editorial apply

# One-shot: decodes a sha256-checked base64 patch and applies the
# type-led editorial hero (home-v51.tsx + _group.css + index.html).
# The driver container's local git writes are gated, so the change
# travels as a base64 patch (robust against escaping). Idempotent:
# no-ops once the editorial hero is present. Delete after it ships.
on:
  push:
    branches: [claude/masterpiece-hero-v51]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and apply
        run: |
          set -euo pipefail
          p=docs/design/hero-editorial.patch.b64
          [ -s "$p" ] || { echo "no patch"; exit 0; }
          if grep -q 'hv-hero-editorial' client/src/pegasus/home-v51.tsx; then echo "already applied"; exit 0; fi
          base64 -d "$p" > /tmp/editorial.patch
          echo "065f15618b9968f0881ccc5c5613e78ef2b214174baa27bbd0eeb9a768ac3555  /tmp/editorial.patch" | sha256sum -c -
          git apply /tmp/editorial.patch
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pegasus/home-v51.tsx client/src/pegasus/_group.css client/index.html
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "feat: type-led editorial hero (owner direction)"
          git push
