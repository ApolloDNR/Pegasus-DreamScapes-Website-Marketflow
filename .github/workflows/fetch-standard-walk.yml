name: Fetch standard walk footage

# Vendors the founder-approved warm-dusk imagery (issue #22 redesign):
#  1. Optimizes the corridor reference master into the homepage hero plate.
#  2. Downloads the upscaled Seedance corridor-walk master from the
#     generation CDN (blocked from the dev container, reachable from CI),
#     extracts the 60-frame scroll-scrub sequence for /pegasus-standard,
#     and removes the superseded blue-hour frames.
# Runs on push; no-ops once the assets exist. Its own commit uses
# GITHUB_TOKEN, which cannot re-trigger this workflow (no recursion).
on:
  push:
    branches:
      - feature/public-website-v1-deal-routing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build hero plates from the reference masters
        run: |
          set -euo pipefail
          out=client/public/images/hall
          mkdir -p "$out"
          if [ -s "$out/corridor-dusk-1600.webp" ]; then echo "have corridor plate"; else
            ffmpeg -hide_banner -loglevel error -y -i docs/design-refs/corridor-dusk.png \
              -vf "scale=1600:-2" -c:v libwebp -q:v 82 "$out/corridor-dusk-1600.webp"
            echo "built corridor-dusk-1600.webp"
          fi
          # The homepage hero: the villa board (the corridor stays exclusive
          # to the /pegasus-standard walk so the two never repeat).
          if [ -s "$out/villa-dusk-1600.webp" ]; then echo "have villa plate"; else
            ffmpeg -hide_banner -loglevel error -y -i docs/design-refs/villa-dusk.jpeg \
              -vf "scale=1600:-2" -c:v libwebp -q:v 82 "$out/villa-dusk-1600.webp"
            echo "built villa-dusk-1600.webp"
          fi
      - name: Encode scrub-optimized walk video
        run: |
          set -euo pipefail
          media=client/public/media
          img=client/public/images/standard
          if [ -s "$media/walk-port.mp4" ]; then echo "have scrub videos"; exit 0; fi
          mkdir -p "$media" "$img"
          curl -fsSL --retry 3 "$WALK_URL" -o /tmp/walk-2k.mp4
          # All-intra (every frame a keyframe) H.264 so scroll-driven seeks
          # land instantly. Two art-directed cuts: a 9:16 portrait crop at
          # the master's native height (no upscale — crisp on phones) and a
          # 1080p landscape cut for desktop. Plus a mid portrait for the
          # self-contained preview artifact and a small VP9 twin for
          # environments without H.264 (also the CI-side verification build).
          enc264() { ffmpeg -hide_banner -loglevel error -y -i /tmp/walk-2k.mp4 \
            -vf "$1" -c:v libx264 -profile:v high -crf "$2" \
            -g 1 -keyint_min 1 -pix_fmt yuv420p -movflags +faststart -an "$3"; }
          enc264 "crop=ih*9/16:ih,fps=30"            26 "$media/walk-port.mp4"
          enc264 "scale=1920:-2,fps=30"              25 "$media/walk-land.mp4"
          enc264 "crop=ih*9/16:ih,scale=720:-2,fps=30" 26 "$media/walk-port-md.mp4"
          ffmpeg -hide_banner -loglevel error -y -i /tmp/walk-2k.mp4 \
            -vf "crop=ih*9/16:ih,scale=540:-2,fps=30" -c:v libvpx-vp9 -crf 38 -b:v 0 \
            -g 1 -row-mt 1 -cpu-used 5 -an "$media/walk-port-test.webm"
          # Poster (first frame) for instant paint / reduced motion / no-JS.
          if [ ! -s "$img/descent-poster.webp" ]; then
            ffmpeg -hide_banner -loglevel error -y -i /tmp/walk-2k.mp4 \
              -vf "select=eq(n\,0),scale=1600:-2" -frames:v 1 -c:v libwebp -q:v 80 \
              "$img/descent-poster.webp"
          fi
          # Superseded first-generation encodes.
          rm -f "$media/walk-scrub.mp4" "$media/walk-scrub-sm.mp4" "$media/walk-scrub-sm.webm"
          ls -la "$media"; du -sh "$media"
        env:
          # Seedance walk eda9ca41 (start frame: docs/design-refs/corridor-dusk.png),
          # upscaled to 2K by bytedance job 92189dc1.
          WALK_URL: "https://d8j0ntlcm91z4.cloudfront.net/user_3EqMQTGQ3AQXoXTWf2covcEGyhp/hf_20260710_031629_92189dc1-76e5-45c5-b807-5590b850b204.mp4"
      - name: Commit vendored assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/images/hall client/public/images/standard client/public/media
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: vendor warm-dusk corridor hero plate + 60-frame walk sequence"
          git push
