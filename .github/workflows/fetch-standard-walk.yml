name: Fetch standard walk footage

# Vendors the founder-approved warm-dusk imagery (issue #22 redesign):
#  1. Optimizes the corridor reference master into the homepage hero plate.
#  2. Downloads the upscaled Seedance corridor-walk master from the
#     generation CDN (blocked from the dev container, reachable from CI),
#     extracts the 60-frame scroll-scrub sequence for /pegasus-standard,
#     and removes the superseded blue-hour frames.
# Runs on push; no-ops once the assets exist. Its own commit uses
# GITHUB_TOKEN, which cannot re-trigger this workflow (no recursion).
on:
  push:
    branches:
      - feature/public-website-v1-deal-routing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build hero plates from the reference masters
        run: |
          set -euo pipefail
          out=client/public/images/hall
          mkdir -p "$out"
          if [ -s "$out/corridor-dusk-1600.webp" ]; then echo "have corridor plate"; else
            ffmpeg -hide_banner -loglevel error -y -i docs/design-refs/corridor-dusk.png \
              -vf "scale=1600:-2" -c:v libwebp -q:v 82 "$out/corridor-dusk-1600.webp"
            echo "built corridor-dusk-1600.webp"
          fi
          # The homepage hero: the villa board (the corridor stays exclusive
          # to the /pegasus-standard walk so the two never repeat).
          if [ -s "$out/villa-dusk-1600.webp" ]; then echo "have villa plate"; else
            ffmpeg -hide_banner -loglevel error -y -i docs/design-refs/villa-dusk.jpeg \
              -vf "scale=1600:-2" -c:v libwebp -q:v 82 "$out/villa-dusk-1600.webp"
            echo "built villa-dusk-1600.webp"
          fi
      - name: Encode scrub-optimized walk video (v3 — 4K/60 master)
        run: |
          set -euo pipefail
          media=client/public/media
          img=client/public/images/standard
          if [ -s "$media/.walk-v3" ]; then echo "have v3 encodes"; exit 0; fi
          mkdir -p "$media" "$img"
          curl -fsSL --retry 3 "$WALK_URL" -o /tmp/walk-4k.mp4
          rm -f "$media"/walk-*.mp4 "$media"/walk-*.webm
          # All-intra H.264 cuts from the motion-interpolated 4K/60 master.
          # Portrait keeps the master's full native height (2160px) — the
          # phone slice is pixel-native at retina density. 60fps preserved
          # so the scrub quantizes at 1/60s.
          enc264() { ffmpeg -hide_banner -loglevel error -y -i /tmp/walk-4k.mp4 \
            -vf "$1" -c:v libx264 -profile:v high -crf "$2" \
            -g 1 -keyint_min 1 -pix_fmt yuv420p -movflags +faststart -an "$3"; }
          enc264 "crop=ih*9/16:ih"              26 "$media/walk-port.mp4"
          enc264 "scale=1920:-2"                25 "$media/walk-land.mp4"
          enc264 "crop=ih*9/16:ih,scale=810:-2" 27 "$media/walk-port-md.mp4"
          enc264 "crop=ih*9/16:ih,scale=810:-2" 30 "$media/walk-port-sm.mp4"
          ffmpeg -hide_banner -loglevel error -y -i /tmp/walk-4k.mp4 \
            -vf "crop=ih*9/16:ih,scale=540:-2,fps=30" -c:v libvpx-vp9 -crf 40 -b:v 0 \
            -g 1 -row-mt 1 -cpu-used 5 -an "$media/walk-port-test.webm"
          touch "$media/.walk-v3"
          ls -la "$media"; du -sh "$media"
        env:
          # Seedance walk eda9ca41 upscaled to 4K/60 by bytedance job 70015dc9.
          WALK_URL: "https://d8j0ntlcm91z4.cloudfront.net/user_3EqMQTGQ3AQXoXTWf2covcEGyhp/hf_20260710_224710_70015dc9-92df-470f-a453-834d5cdfcdfe.mp4"
      - name: Commit vendored assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/images/hall client/public/images/standard client/public/media
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: vendor warm-dusk corridor hero plate + 60-frame walk sequence"
          git push
