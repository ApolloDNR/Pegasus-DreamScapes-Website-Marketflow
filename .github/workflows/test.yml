name: Launch Verification

on:
  push:
  pull_request:

jobs:
  test:
    name: launch verification
    runs-on: ubuntu-latest
    env:
      AI_INTEGRATIONS_OPENAI_API_KEY: ci-test-key
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pin npm for reproducible CI
        run: npm install --global npm@10.9.2

      - name: Verify portable package lock registry URLs
        run: node scripts/check-package-lock-registry.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install matching Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify launch environment contract
        run: npm run smoke:launch -- --example

      - name: Run TypeScript check
        run: npm run check

      - name: Run production build
        run: npm run build

      - name: Run rendered accessibility gate
        run: npm run check:a11y

      - name: Run test suite
        run: npm test
